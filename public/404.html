<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Universal AI Charter</title>
    <!--
      GitHub Pages has no server-side rewrites, so a deep link like
      /ai-charter/faq returns this 404 page. This redirects it back to
      index.html with the original path packed into the query string, so
      client-side routing (BrowserRouter) can restore it.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1 // keep "/ai-charter"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?p=/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
