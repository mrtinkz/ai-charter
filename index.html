    <!-- Google Analytics (gtag.js) -->

    <script>

    <script>
      // GitHub Pages SPA redirect: decode the path packed by 404.html back
      // into a real URL before the router mounts. See public/404.html.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
